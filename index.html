<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">¨

</head>

<body>
    <header class="header">
        <div class="logo">
            <h1>Teen IT Day</h1>
        </div>

        <nav class="header-nav">
            <ul class="header-nav-list">
                <li class="header-nav-item"><a href="#">Home</a></li>
                <li class="header-nav-item"><a href="#">About</a></li>
                <li class="header-nav-item"><a href="#">Contact</a></li>
            </ul>
        </nav>

    </header>


    <div class="main">
        <div class="welcome-message-container">
            <h2 class="welcome-message">Welcome to Teen IT Day!</h2>
            <div class="welcome-message-text-container">
                <p class="welcome-message-text">Join us for an exciting day of technology, innovation, and learning!</p>
                <p class="welcome-message-text">Register now to secure your spot and be part of this amazing event!</p>
            </div>
        </div>

        <div class="container">

            <div class="registration">
                <form>
                    <label class="form-name" for="name">Your Name</label>
                    <input class="input-name" type="text" id="name" name="name" placeholder="Enter your name">

                    <label class="form-lastname" for="lastname"> Your Last Name</label>
                    <input class="input-lastname" type="text" id="lastname" name="lastname"
                        placeholder="Enter your last name">

                    <label class="form-email" for="email">Your Email</label>
                    <input class="input-email" type="email" id="email" name="email" placeholder="Enter your email">

                </form>

                <form>
                    <input class="input-agree" type="checkbox" id="agree" name="agree">
                    <label class="form-agree" for="agree">I agree to the <a href="#">terms and conditions</a></label>
                </form>

                <button class="submit-button" type="submit">Submit</button>
            </div>
        </div>
    </div>
</body>

</html>
